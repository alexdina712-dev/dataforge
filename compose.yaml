services:
  dataforge:
    build: .
    ports: ['8080:8080']
    environment:
      APP_ORIGIN: http://localhost:8080
      ENVIRONMENT: development
      SERVE_WEB: 'true'
      MAX_STORE_BYTES: '100663296'
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/api/health", timeout=5)']
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
